name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Retry npm publishing for an existing release tag (for example v0.1.0); leave empty to update the release PR'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.release_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # PRs created with GITHUB_TOKEN need explicit CI dispatch.
      - name: Run CI on release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          jq -r '.[].headBranchName' <<< "$RELEASE_PRS" | while IFS= read -r branch; do
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          done

  # Releases created with GITHUB_TOKEN do not trigger a separate workflow.
  publish:
    needs: release
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.release.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || needs.release.outputs.tag_name }}
    steps:
      - name: Validate GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease | \
            jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false and .isPrerelease == false'
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Check version and retry status
        id: npm
        run: bun scripts/check-npm-release.ts
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Test the archive to publish
        run: bun run test:package "$RUNNER_TEMP/ultra-learner.tgz"
      - run: git diff --exit-code
      - name: Publish tested archive to npm with OIDC
        if: steps.npm.outputs.publish == 'true'
        run: bun scripts/publish-npm.ts "$RUNNER_TEMP/ultra-learner.tgz"
      - name: Verify published package from a clean consumer directory
        env:
          VERSION: ${{ steps.npm.outputs.version }}
          PUBLISHED: ${{ steps.npm.outputs.publish }}
        run: bun scripts/verify-npm-release.ts
