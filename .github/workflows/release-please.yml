name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Retry npm publishing for an existing release tag (for example v0.1.0); leave empty to update the release PR'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.release_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GITHUB_TOKEN-created PRs do not trigger ordinary PR CI.
      - name: Run CI on release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          jq -r '.[].headBranchName' <<< "$RELEASE_PRS" | while IFS= read -r branch; do
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          done

  # Keep publishing in this workflow: a GITHUB_TOKEN-created release does not
  # trigger another workflow. Retries must also retain this OIDC identity.
  publish:
    needs: release
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.release.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || needs.release.outputs.tag_name }}
    steps:
      - name: Validate GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease | \
            jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false and .isPrerelease == false'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Check Trusted Publishing client
        run: |
          bun -e 'const result = Bun.spawnSync(["npm", "--version"]); if (result.exitCode !== 0 || !Bun.semver.satisfies(result.stdout.toString().trim(), ">=11.5.1")) throw new Error("Trusted Publishing requires npm >=11.5.1");'
      - name: Check npm version and retry status
        id: npm
        run: bun scripts/check-npm-release.ts
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Pack and verify the exact release archive
        run: bun run test:package "$RUNNER_TEMP/ultra-learner.tgz"
      - run: git diff --exit-code
      - name: Publish to npm with OIDC
        if: steps.npm.outputs.publish == 'true'
        run: npm publish "$RUNNER_TEMP/ultra-learner.tgz" --access public --tag latest --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Verify published package with bunx
        env:
          PUBLISHED: ${{ steps.npm.outputs.publish }}
        run: bun scripts/verify-npm-release.ts
